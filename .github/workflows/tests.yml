name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Code style (Pint)
        run: vendor/bin/pint --test

  dist:
    name: Frontend build is fresh
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: The committed dist/ matches the sources
        run: npm run check:dist

  docs:
    name: Documentation is consistent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Relative links and anchors
        run: node scripts/check-docs.mjs

      - name: Every config key is documented
        run: node scripts/check-config-docs.mjs

      - name: docs/HISTORY.md matches the OpenSpec archive
        run: node scripts/history.mjs --check
